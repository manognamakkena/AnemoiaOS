<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>anemoia</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg">
    <div class="static">
        <div class="taskbar"> <!--footer, time, apps-->
            <div class="mapButton">
                <button class="appButton" id="mapOpen" data-target="map">Maps</button>
            </div>
            <div class="folderButton">
                <button class="appButton" id="folderOpen" data-target="sets">Folder</button>
            </div>
        </div>
    </div>

    <div class="sets" id="sets">
        <div class="header" id="header"></div>
        <h1 class="text-3xl font-bold underline">Hello World!</h1>
    </div>

    <div class="map" id="map">
        <div class="header" id="header">
            <button class="closeButton" id="close">x</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
